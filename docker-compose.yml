version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mediassist
      - SECRET_KEY=change-this-to-a-secure-key-in-production
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001
    depends_on:
      - db
    volumes:
      - ./backend:/app/backend
      - ./backend/trained_model:/app/backend/trained_model
      - ./backend/reports:/app/backend/reports
      - ./backend/generated_reports:/app/backend/generated_reports
    command: sh -c "cd /app/backend && alembic upgrade head && python -m backend.services.seed_service && uvicorn backend.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mediassist
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
