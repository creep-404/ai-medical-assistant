version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mediassist
      - SECRET_KEY=change-this-to-a-secure-key-in-production
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - ./backend/trained_model:/app/trained_model
      - ./backend/reports:/app/reports

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mediassist
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
